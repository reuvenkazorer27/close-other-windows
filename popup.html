<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 340px;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      color: #e0e0e0;
      padding: 20px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      flex-shrink: 0;
    }

    .header-icon svg {
      width: 18px;
      height: 18px;
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .header-text p {
      font-size: 11px;
      color: #6b7280;
      margin-top: 1px;
    }

    /* Stats cards */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .stat-number {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-card.total .stat-number { color: #60a5fa; }
    .stat-card.files .stat-number { color: #fbbf24; }
    .stat-card.pages .stat-number { color: #a78bfa; }
    .stat-card.files.zero .stat-number { color: #4ade80; }

    .stat-label {
      font-size: 9px;
      font-weight: 500;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Window list */
    .window-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 16px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .window-list::-webkit-scrollbar { width: 4px; }
    .window-list::-webkit-scrollbar-track { background: transparent; }
    .window-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }

    .window-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 11px;
      color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.15s;
    }

    .window-item:last-child { border-bottom: none; }
    .window-item:hover { background: rgba(255, 255, 255, 0.03); }
    .window-item.current { color: #4ade80; }

    .window-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .window-dot.file { background: #fbbf24; box-shadow: 0 0 6px rgba(251, 191, 36, 0.4); }
    .window-dot.page { background: #a78bfa; box-shadow: 0 0 6px rgba(167, 139, 250, 0.4); }
    .window-item.current .window-dot { background: #4ade80; box-shadow: 0 0 6px rgba(74, 222, 128, 0.4); }

    .window-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .window-badge {
      font-size: 9px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .window-item.current .window-badge {
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
    }

    .window-badge.file-badge {
      background: rgba(251, 191, 36, 0.15);
      color: #fbbf24;
    }

    .window-badge.page-badge {
      background: rgba(167, 139, 250, 0.15);
      color: #a78bfa;
    }

    .empty-state {
      padding: 20px;
      text-align: center;
      color: #4b5563;
      font-size: 12px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #fff;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0px);
    }

    .btn:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .btn-files {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .btn-files:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
    }

    .btn-all {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .btn-all:hover:not(:disabled) {
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      background: linear-gradient(135deg, #f87171, #ef4444);
    }

    .btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
      opacity: 1 !important;
    }

    .btn-count {
      background: rgba(255, 255, 255, 0.2);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 8px;
      font-weight: 700;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }
    .divider span {
      font-size: 9px;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Shortcut hint */
    .shortcut-hint {
      text-align: center;
      margin-top: 12px;
      font-size: 10px;
      color: #4b5563;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stats { animation: fadeIn 0.2s ease; }
    .window-list { animation: fadeIn 0.3s ease; }
    .btn-group { animation: fadeIn 0.35s ease; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .closing-pulse { animation: pulse 0.5s ease infinite; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Close Other Windows</h1>
      <p>One click cleanup</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card total">
      <div class="stat-number" id="totalCount">-</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card files" id="filesCard">
      <div class="stat-number" id="filesCount">-</div>
      <div class="stat-label">Files</div>
    </div>
    <div class="stat-card pages" id="pagesCard">
      <div class="stat-number" id="pagesCount">-</div>
      <div class="stat-label">Pages</div>
    </div>
  </div>

  <div class="window-list" id="windowList">
    <div class="empty-state">Loading...</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-files" id="closeFilesBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
      Close Files Only
      <span class="btn-count" id="filesCloseCount">0</span>
    </button>

    <div class="divider"><span>or</span></div>

    <button class="btn btn-all" id="closeAllBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close All Others
      <span class="btn-count" id="allCloseCount">0</span>
    </button>
  </div>

  <div class="shortcut-hint">
    Pin this extension for quick access
  </div>

  <script src="popup.js"></script>
</body>
</html>
