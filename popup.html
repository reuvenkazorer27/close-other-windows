<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 300px;
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #13131d;
      color: #e0e0e0;
      padding: 14px;
    }

    /* Header — compact single row */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .header-icon {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { width: 14px; height: 14px; }

    .header h1 {
      font-size: 13px; font-weight: 700; color: #fff;
      flex: 1;
    }

    .header .window-count {
      font-size: 11px; color: #6b7280;
    }
    .header .window-count span { color: #60a5fa; font-weight: 600; }

    /* Window list — collapsible, compact */
    .window-list {
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .window-list::-webkit-scrollbar { width: 3px; }
    .window-list::-webkit-scrollbar-track { background: transparent; }
    .window-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }

    .window-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      font-size: 11px; color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .window-item:last-child { border-bottom: none; }
    .window-item.current { color: #4ade80; }

    .window-dot {
      width: 5px; height: 5px;
      border-radius: 50%; flex-shrink: 0;
    }
    .window-dot.file { background: #fbbf24; }
    .window-dot.page { background: #a78bfa; }
    .window-item.current .window-dot { background: #4ade80; }

    .window-title {
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1;
    }

    .badge {
      font-size: 8px; font-weight: 700;
      padding: 1px 5px; border-radius: 3px;
      flex-shrink: 0; text-transform: uppercase;
    }
    .badge-keep { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .badge-file { background: rgba(251, 191, 36, 0.12); color: #fbbf24; }
    .badge-page { background: rgba(167, 139, 250, 0.12); color: #a78bfa; }

    .empty-state {
      padding: 14px; text-align: center;
      color: #4b5563; font-size: 11px;
    }

    /* Buttons — side by side */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      padding: 9px 6px;
      border: none; border-radius: 10px;
      font-family: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer; color: #fff;
      display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { cursor: default; opacity: 0.35; }

    .btn-files {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.25);
    }
    .btn-all {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 3px 10px rgba(239, 68, 68, 0.25);
    }

    .btn.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      box-shadow: 0 3px 10px rgba(34, 197, 94, 0.25) !important;
      opacity: 1 !important;
    }

    .btn-label { font-size: 11px; }

    .btn-num {
      font-size: 18px; font-weight: 800; line-height: 1;
    }

    .btn-sub {
      font-size: 8px; font-weight: 500;
      opacity: 0.7; text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .window-list { animation: fadeIn 0.2s ease; }
    .btn-row { animation: fadeIn 0.25s ease; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .closing-pulse { animation: pulse 0.4s ease infinite; }

    /* Select specific windows */
    .select-toggle {
      text-align: center;
      font-size: 10px; color: #6b7280;
      margin-top: 8px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .select-toggle:hover { color: #60a5fa; }
    .select-toggle.open { color: #60a5fa; }

    .select-panel {
      margin-top: 8px;
      animation: fadeIn 0.2s ease;
    }
    .select-panel.hidden { display: none; }

    .select-list {
      max-height: 140px;
      overflow-y: auto;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 8px;
    }
    .select-list::-webkit-scrollbar { width: 3px; }
    .select-list::-webkit-scrollbar-track { background: transparent; }
    .select-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 3px; }

    .select-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      font-size: 11px; color: #9ca3af;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.1s;
    }
    .select-item:last-child { border-bottom: none; }
    .select-item:hover { background: rgba(255, 255, 255, 0.04); }

    .select-item input[type="checkbox"] {
      accent-color: #60a5fa;
      width: 13px; height: 13px;
      flex-shrink: 0; cursor: pointer;
    }

    .select-item .select-title {
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex: 1;
    }

    .btn-select {
      width: 100%;
      padding: 8px;
      border: none; border-radius: 8px;
      font-family: inherit; font-size: 11px; font-weight: 600;
      cursor: pointer; color: #fff;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25);
      transition: all 0.15s ease;
    }
    .btn-select:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
    .btn-select:disabled { cursor: default; opacity: 0.35; }
    .btn-select.done {
      background: linear-gradient(135deg, #22c55e, #16a34a) !important;
      box-shadow: 0 3px 10px rgba(34, 197, 94, 0.25) !important;
      opacity: 1 !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <h1>Close Other Windows</h1>
    <div class="window-count"><span id="totalCount">-</span> open</div>
  </div>

  <div class="window-list" id="windowList">
    <div class="empty-state">Loading...</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-files" id="closeFilesBtn">
      <span class="btn-num" id="filesCount">-</span>
      <span class="btn-sub">files</span>
      <span class="btn-label">Close Files</span>
    </button>
    <button class="btn btn-all" id="closeAllBtn">
      <span class="btn-num" id="allCount">-</span>
      <span class="btn-sub">windows</span>
      <span class="btn-label">Close All</span>
    </button>
  </div>

  <div class="select-toggle" id="selectToggle">Select specific windows ▾</div>

  <div class="select-panel hidden" id="selectPanel">
    <div class="select-list" id="selectList"></div>
    <button class="btn btn-select" id="closeSelectedBtn" disabled>
      <span class="btn-label">Close Selected (<span id="selectedCount">0</span>)</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
